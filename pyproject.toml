[project]
name = "tiktok-threads-engine"
version = "0.1.0"
description = "Autonomous TikTok affiliate -> Threads content & conversion engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-telegram-bot>=21",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "apscheduler",
    "feedparser",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
